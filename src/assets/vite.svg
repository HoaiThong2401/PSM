<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Glass Highlight Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border / Glass Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>

  <!-- Background Decorative Ambient Glow -->
  <circle cx="390" cy="120" r="110" fill="#38bdf8" opacity="0.35" filter="url(#glow)"/>
  <circle cx="120" cy="390" r="100" fill="#818cf8" opacity="0.3" filter="url(#glow)"/>

  <!-- Central Graphic: Modern Wallet & Rising Growth Elements -->
  <g filter="url(#shadow)">
    <!-- Cash Banknote sticking out of wallet -->
    <path d="M150 160 V126 C150 110 164 96 180 96 H332 C348 96 362 110 362 126 V160 Z" fill="#10b981"/>
    <circle cx="256" cy="128" r="14" fill="#a7f3d0"/>

    <!-- Wallet Back / Main Body -->
    <rect x="106" y="150" width="300" height="230" rx="36" fill="#1e1b4b" fill-opacity="0.75"/>
    <rect x="106" y="150" width="300" height="230" rx="36" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.45)" stroke-width="6"/>

    <!-- Wallet Flap / Front Pocket with curved line -->
    <path d="M106 236 C106 236 178 280 256 280 C334 280 406 236 406 236 V344 C406 364 390 380 370 380 H142 C122 380 106 364 106 344 Z" fill="#312e81" fill-opacity="0.9" stroke="rgba(255,255,255,0.35)" stroke-width="5"/>

    <!-- Gold Coin / Clasp with Currency Symbol -->
    <circle cx="256" cy="280" r="46" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="5" filter="url(#glow)"/>
    <circle cx="256" cy="280" r="36" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="5 3"/>
    
    <!-- Currency Symbol inside Coin -->
    <path d="M242 260 H270 M256 260 V300 M244 280 H268 M244 300 H268" stroke="#854d0e" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Dynamic Growth Arrow Overlay -->
    <g transform="translate(36, -36)">
      <path d="M290 195 L365 120 M365 120 H315 M365 120 V170" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <path d="M290 195 L365 120 M365 120 H315 M365 120 V170" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Sparkle Stars -->
    <path d="M400 95 Q400 115 420 115 Q400 115 400 135 Q400 115 380 115 Q400 115 400 95 Z" fill="#fbbf24"/>
    <path d="M105 185 Q105 198 118 198 Q105 198 105 211 Q105 198 92 198 Q105 198 105 185 Z" fill="#38bdf8"/>
  </g>
</svg>
